name: Release A API CI

on:
  push:
    branches:
      - 'codex/release-a-*'

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Typecheck API
        working-directory: services/api
        run: npm run typecheck

      - name: Test API
        working-directory: services/api
        run: npm test

      - name: Build API
        working-directory: services/api
        run: npm run build

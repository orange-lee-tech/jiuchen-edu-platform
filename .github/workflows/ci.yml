name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One automatic entry for development commits: the PR event.
# Keep the full verification job and its check name unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, orangeleetec-local-linux]
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_test_only
          MYSQL_DATABASE: jiuchen_commercial_controls_ci
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and typecheck miniprogram
        working-directory: apps/miniprogram
        run: |
          npm install
          npm run typecheck

      - name: Verify native navigation, real-data and export regressions
        run: node --test tools/testing/miniprogram-navigation.test.cjs tools/testing/school-catalog.test.cjs tools/testing/report-export.test.cjs tools/testing/real-data.test.cjs

      - name: Install, test and build admin
        working-directory: apps/admin
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Install, test and build API
        working-directory: services/api
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Prepare disposable MySQL fixture for commercial migrations
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: |
          node --input-type=module <<'JS'
          import mysql from 'mysql2/promise'
          const db = await mysql.createConnection(process.env.DATABASE_URL)
          try {
            await db.query('ALTER DATABASE jiuchen_commercial_controls_ci CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci')
            await db.query("CREATE TABLE users (id VARCHAR(36) NOT NULL PRIMARY KEY, role ENUM('user','student','teacher','staff','admin') NOT NULL DEFAULT 'user', status ENUM('active','deleted') NOT NULL DEFAULT 'active') ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci")
            await db.query("INSERT INTO users(id,role) VALUES ('00000000-0000-4000-8000-000000000001','admin'),('00000000-0000-4000-8000-000000000002','admin')")
            await db.query("CREATE TABLE payment_orders (id VARCHAR(36) NOT NULL PRIMARY KEY, user_id VARCHAR(36) NOT NULL,out_trade_no VARCHAR(64) NULL UNIQUE,status ENUM('pending','paid','closed','refunded') NOT NULL DEFAULT 'pending',amount_fen INT NOT NULL DEFAULT 0,credit_amount INT NOT NULL DEFAULT 0,created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,KEY payment_orders_user_id_idx (user_id), CONSTRAINT payment_orders_user_fk FOREIGN KEY (user_id) REFERENCES users(id)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci")
            await db.query("CREATE TABLE internal_ids (id VARCHAR(36) NOT NULL PRIMARY KEY,business_id VARCHAR(40) NOT NULL UNIQUE,type ENUM('student','teacher','admin') NOT NULL,claim_mode ENUM('self','admin') NOT NULL DEFAULT 'self',status ENUM('available','claimed','disabled') NOT NULL DEFAULT 'available',user_id VARCHAR(36) NULL,entity_id VARCHAR(36) NULL,claimed_at TIMESTAMP NULL,UNIQUE KEY internal_ids_user_id_unique(user_id),CONSTRAINT internal_ids_user_fk FOREIGN KEY(user_id) REFERENCES users(id)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci")
            await db.query('CREATE TABLE teachers (id VARCHAR(36) NOT NULL PRIMARY KEY,user_id VARCHAR(36) NULL UNIQUE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci')
            await db.query('CREATE TABLE students (id VARCHAR(36) NOT NULL PRIMARY KEY,user_id VARCHAR(36) NULL UNIQUE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci')
          } finally { await db.end() }
          JS
      - name: Run new commercial migrations twice on MySQL 8
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: |
          npm run db:upgrade:virtual-delivery
          npm run db:upgrade:admin-controls
          npm run db:upgrade:assessment-keys
          npm run db:upgrade:credit-plans
          npm run db:upgrade:dual-identity
          npm run db:upgrade:virtual-delivery
          npm run db:upgrade:admin-controls
          npm run db:upgrade:assessment-keys
          npm run db:upgrade:credit-plans
          npm run db:upgrade:dual-identity
      - name: Verify commercial migrations and control-box transactions on MySQL 8
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: node dist/db/verify-commercial-controls-mysql.js
      - name: Verify object migration, plan switching and dual identity on MySQL 8
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: |
          npm run db:upgrade:assessment-keys
          npm run db:upgrade:credit-plans
          npm run db:upgrade:dual-identity
          node dist/db/verify-closed-loop-mysql.js
      - name: Verify AI cost and model copy migrations twice on disposable MySQL 8
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: |
          npm run db:upgrade:assessment
          node dist/db/verify-ai-cost-model-copy-mysql.js
      - name: Verify virtual payment exception migration twice on disposable MySQL 8
        working-directory: services/api
        env:
          DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/jiuchen_commercial_controls_ci
        run: |
          npm run db:upgrade:virtual-payment-reliability
          node dist/db/verify-virtual-payment-reliability-mysql.js prepare
          npm run db:upgrade:virtual-payment-reliability
          node dist/db/verify-virtual-payment-reliability-mysql.js verify

name: P1 frontend release verification
run-name: P1 frontend 449d7472 - local verification

on:
  push:
    branches: [p1/foundation]
    paths: ['.github/workflows/p1-frontend-release-local.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-frontend-release-local
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: [self-hosted, Linux, X64, orangeleetec-local-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 449d7472adff884401e375703364384bf0c65034
          persist-credentials: false
      - name: Verify exact frontend source
        run: |
          test "$(git rev-parse HEAD)" = "449d7472adff884401e375703364384bf0c65034"
          echo "TESTED_FRONTEND=449d7472adff884401e375703364384bf0c65034"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck miniprogram
        working-directory: apps/miniprogram
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Navigation, catalog, export and real-data regressions
        run: node --test tools/testing/miniprogram-navigation.test.cjs tools/testing/school-catalog.test.cjs tools/testing/report-export.test.cjs tools/testing/real-data.test.cjs
      - name: Record release boundaries
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          printf 'Frontend source: 449d7472adff884401e375703364384bf0c65034\nAPI candidate: eda525c1a2276af90668849b669e9bce19a4fd7d (separately tested)\nResult: %s\nNo production connection, deployment or device acceptance.\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

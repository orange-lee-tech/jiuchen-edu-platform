name: P1 frontend release verification
run-name: P1 frontend 1e3f22e5 - integrated release verification

on:
  push:
    branches: [p1/foundation]
    paths: ['.github/workflows/p1-frontend-release-local.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-frontend-release-local
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: [self-hosted, Linux, X64, orangeleetec-local-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e3f22e57b7eeff817fddd389915a7c5da15dd0e
          persist-credentials: false
      - name: Verify exact frontend source
        run: |
          test "$(git rev-parse HEAD)" = "1e3f22e57b7eeff817fddd389915a7c5da15dd0e"
          echo "TESTED_FRONTEND=1e3f22e57b7eeff817fddd389915a7c5da15dd0e"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck miniprogram
        working-directory: apps/miniprogram
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Navigation, catalog, export and real-data regressions
        run: node --test tools/testing/miniprogram-navigation.test.cjs tools/testing/school-catalog.test.cjs tools/testing/report-export.test.cjs tools/testing/real-data.test.cjs
      - name: Record release boundaries
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          printf 'Frontend source: 1e3f22e57b7eeff817fddd389915a7c5da15dd0e\nAPI candidate: e5908185b3b460a04a8102b7e2a30b663623ac30 (separately tested)\nResult: %s\nNo production connection, deployment or device acceptance.\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

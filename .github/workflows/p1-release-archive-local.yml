name: P1 isolated release archive
on:
  push:
    branches: [p1/foundation]
    paths: ['.github/workflows/p1-release-archive-local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: [self-hosted, Linux, X64, orangeleetec-local-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e5908185b3b460a04a8102b7e2a30b663623ac30
          fetch-depth: 0
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 449d7472adff884401e375703364384bf0c65034
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and package immutable source
        shell: bash
        run: |
          test "$(git -C release-source rev-parse HEAD)" = "e5908185b3b460a04a8102b7e2a30b663623ac30"
          node release-tools/tools/release/package-isolated-api.mjs release-source e5908185b3b460a04a8102b7e2a30b663623ac30 "$RUNNER_TEMP/p1-e5908185-archive" | tee "$RUNNER_TEMP/p1-e5908185-summary.txt"
          cat "$RUNNER_TEMP/p1-e5908185-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p1-api-e5908185-readonly
          path: ${{ runner.temp }}/p1-e5908185-archive/
          retention-days: 1
          if-no-files-found: error

# GitHub Actions 登记（2026-10-27）
# 分类：quality、integration。当前仓库运行入口共三条。
# 自托管 Runner 注册于本仓库，Windows 11 / Ubuntu 24.04 WSL2。
# 实际标签拼写为 orangeleetec-local-linux；Mac mini 尚未迁移。
# 每条 workflow 的 job 以文件为准，本表记录现役归属和触发边界。

runner:
  selector: [self-hosted, Linux, X64, orangeleetec-local-linux]
  name: orangeleetech-wsl-local
  operation: ./run.sh
  availability: requires_windows_awake_network_and_listener
  production_credentials: none
workflows:
  - id: quality-ci
    file: .github/workflows/ci.yml
    cluster: quality
    status: enabled
    triggers: [main-push, pull-request, manual]
    jobs: [verify]
    runner: self-hosted
    purpose: mini-typecheck-and-regressions_admin-test-build_api-test-build
    note: historical_hosted_failure_before_steps_is_not_test_failure
  - id: integration-news-mysql
    file: .github/workflows/news-v2-mysql-gate.yml
    cluster: integration
    status: enabled
    triggers: [scoped-p1-push, scoped-pull-request, manual]
    jobs: [mysql-gate]
    runner: self-hosted
    side_effects: [disposable_mysql_service]
  - id: integration-profile-mysql
    file: .github/workflows/profile-mysql-gate.yml
    cluster: integration
    status: enabled
    triggers: [scoped-p1-push, scoped-pull-request, manual]
    jobs: [profile-gate]
    runner: self-hosted
    side_effects: [disposable_mysql_service]
